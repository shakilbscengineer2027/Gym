services:
  postgres:
    image: postgres:16-alpine
    container_name: apexpulse_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apexuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alockinfitness123}
      POSTGRES_DB: ${POSTGRES_DB:-apexpulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apexuser} -d ${POSTGRES_DB:-apexpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apexpulse_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-apexredispass123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-apexredispass123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
